# ~/.lima/ai-agents/lima.yaml
# Start with: limactl start --name=ai-agents lima.yaml

vmType: "qemu"
arch: "x86_64"   # use "aarch64" on Apple Silicon / ARM hosts

images:
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 4
memory: "8GiB"
disk: "60GiB"

mounts:
  - location: "~/ai-workspace"
    mountPoint: "{{.Home}}/ai-workspace"
    writable: true

# Forward ports so you can hit APIs/UIs running inside the VM from your host
portForwards:
  - guestPort: 8000
    hostPort: 8000
  - guestPort: 11434   # Ollama default, if you run local models
    hostPort: 11434

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Docker install (many agent frameworks/tools expect it)
      if ! command -v docker &> /dev/null; then
        curl -fsSL https://get.docker.com | sh
        usermod -aG docker "${LIMA_CIDATA_USER}"
      fi
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y python3 python3-pip python3-venv git curl build-essential

  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Example: set up a venv for agent tooling
      python3 -m venv ~/agent-env
      ~/agent-env/bin/pip install --upgrade pip

  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      curl -fsSL https://opencode.ai/install | bash

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until command -v docker >/dev/null; do sleep 3; done"; then
        echo >&2 "docker is not installed yet"
        exit 1
      fi
    hint: |
      Docker installation is taking longer than expected.

  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 60s bash -c "until [ -x \$HOME/.opencode/bin/opencode ] || command -v opencode >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "opencode is not installed yet"
        exit 1
      fi
    hint: |
      opencode installation is taking longer than expected.

message: |
  AI agent VM is ready.
  - SSH in: limactl shell ai-agents
  - Workspace mounted at: ~/ai-agents-workspace
  - Python venv: source ~/agent-env/bin/activate
  - Docker available for containerized agent tools
  - opencode installed - run: opencode
